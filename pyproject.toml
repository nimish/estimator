[project]
name = "tsgam-estimator"
version = "0.1.0"
description = "Time series GAM (Generalized Additive Model) estimators for load forecasting"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Nimish Telang" },
]
keywords = [
    "time-series",
    "forecasting",
    "generalized-additive-models",
    "optimization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "cvxpy>=1.7.3,<2",
    "numpy>=2.3.4,<3",
    "pandas>=2.3.3,<4",
    "scipy>=1.16.3,<2",
    "scikit-learn>=1.7.2,<2",
    "spcqe>=0.3.0,<0.4",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.10.7",
]

[project.urls]
Homepage = "https://github.com/nimish/estimator"
Repository = "https://github.com/nimish/estimator"
Issues = "https://github.com/nimish/estimator/issues"

[dependency-groups]
test = [
    {include-group = "examples"},
    {include-group = "notebooks"},
    {include-group = "viz"},
    "openpyxl>=3.1.5",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]
typecheck = [
    "ty>=0.0.50",
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=3.0.0",
    "myst-parser>=3.0.0",
]
viz = [
    "altair>=6.0.0",
    "matplotlib>=3.10.7",
    "seaborn>=0.13.2",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.9.0.post1",
]
notebooks = [
    "click>=8.1.0",
    "holidays>=0.87",
    "marimo>=0.23.4",
    "msgspec>=0.20.0",
    "openai>=2.14.0",
    "openpyxl>=3.1.5",
    "pyarrow>=22.0.0",
    "solar-data-tools>=2.1.1",
    "statsmodels>=0.14.5",
    "tabulate>=0.9.0",
]
# Example/run scripts only (CLI + rich UI); not required by the core library.
# PV script also needs solar-data-tools and matplotlib for DataHandler and plots.
examples = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "matplotlib>=3.10.0",
    "solar-data-tools>=2.1.1",
    "plotly>=6.7.0",
]
dev = [
    {include-group = "test"},
    {include-group = "typecheck"},
    {include-group = "docs"},
]

[build-system]
requires = ["uv_build>=0.9.23,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "tsgam_estimator"
module-root = "src"

[tool.ty.environment]
python-version = "3.12"
root = ["./src"]

[tool.ty.src]
include = ["src"]

[tool.coverage.run]
relative_files = true
source = ["src/tsgam_estimator"]

[tool.marimo.runtime]
output_max_bytes = 50_000_000
